<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出荷資材 棚卸</title><link rel="stylesheet" href="/style.css">
<header><small>出荷資材管理 / 開発用試作</small><h1>棚卸ワークスペース</h1><p>仮CSVで操作を確認できます。出力は確認用で、売りexへの取り込みには使用できません。</p></header>
<main><p id="message" role="status"></p><section class="wide"><p id="pending-status"></p><button id="retry">同じ操作を再送</button><button id="reload">最新状態を読み込む</button></section><section><h2>1. 対象を取り込む</h2><label>担当者<input id="actor" value="試験担当者" required></label><label>作業区画（カンマ区切り）<input id="locations" value="A"></label><label>文字コード<select id="encoding"><option value="utf-8-sig">UTF-8</option><option value="cp932">CP932</option></select></label><label>仮形式CSV<input type="file" id="file" accept=".csv"></label><p>ヘッダー付きCSVを選択し、列を割り当ててください。</p><button id="inspect">列を読み込む</button><div id="mapping" hidden><label>商品番号の列<select id="map-code"></select></label><label>名称の列<select id="map-name"></select></label><label>システム数量の列<select id="map-baseline"></select></label><button id="preview">全件検証・プレビュー</button></div><p id="preview-info"></p><div class="scroll"><table><thead><tr><th>商品番号</th><th>名称</th><th>数量</th></tr></thead><tbody id="preview-rows"></tbody></table></div><button id="create" disabled>確認した内容で棚卸を開始</button></section>
<section><h2>2. 実数を記録する</h2><label>棚卸<select id="session"></select></label><label>区画<select id="location"></select></label><label>商品番号／バーコード<input id="code" autocomplete="off"></label><p id="product"></p><label>実数<input id="quantity" inputmode="decimal" autocomplete="off"></label><label>端末識別<input id="device" value="PC-DEMO"></label><button id="save">記録する</button><p>既存記録がある場合は確認後に訂正します。競合も候補を確認して訂正します。</p><button id="complete">この区画の棚卸完了を確認</button></section>
<section class="wide"><h2>未登録バーコードの保留</h2><select id="held"></select><p>商品番号入力欄に照合先を入力し、解決してください。誤読は理由を残して除外できます。</p><button id="resolve">選択した保留を照合</button><button id="dismiss">理由を付けて除外</button></section><section class="wide"><h2>3. 結果を確認する</h2><p id="state"></p><div class="scroll"><table><thead><tr><th>商品番号</th><th>名称</th><th>基準</th><th>実数</th><th>差異</th></tr></thead><tbody id="rows"></tbody></table></div><button id="finalize">結果を確定</button><button id="reopen">確定を訂正する（出力前）</button><button id="export">確認用CSVを保存</button><details><summary>作業・訂正履歴</summary><pre id="audit"></pre></details></section></main><script src="/app.js"></script></html>
